<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 交流群 - 豆包 · 通义千问 · DeepSeek</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: #0b1120 url('/static/bg.png') center/cover no-repeat fixed;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .chat-container {
    width: 100%;
    max-width: 760px;
    height: 100vh;
    max-height: 920px;
    display: flex;
    flex-direction: column;
    background: rgba(15, 23, 42, 0.9);
    box-shadow: 0 8px 40px rgba(0,0,0,.5);
    backdrop-filter: blur(8px);
  }
  /* ---------- 顶部栏 ---------- */
  .header {
    background: #1f2937;
    color: #fff;
    padding: 14px 18px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }
  .header .avatars { display: flex; }
  .header .avatars .mini-avatar {
    width: 34px; height: 34px;
    border-radius: 50%;
    border: 2px solid #1f2937;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 700; color: #fff;
    margin-left: -10px;
  }
  .header .avatars .mini-avatar:first-child { margin-left: 0; }
  .header .title-box { flex: 1; min-width: 0; }
  .header .title { font-size: 17px; font-weight: 600; }
  .header .subtitle { font-size: 12px; color: #9ca3af; margin-top: 2px; }
  .mode-badge {
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 999px;
    background: #374151;
    color: #d1d5db;
    white-space: nowrap;
  }
  .mode-badge.live { background: #065f46; color: #a7f3d0; }
  /* ---------- 模式切换栏 ---------- */
  .mode-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 8px 14px;
    background: rgba(31, 41, 55, 0.85);
    border-bottom: 1px solid rgba(75, 85, 99, 0.4);
    flex-shrink: 0;
    flex-wrap: wrap;
  }
  .mode-switch {
    display: flex;
    background: rgba(17, 24, 39, 0.8);
    border-radius: 999px;
    padding: 3px;
  }
  .mode-btn {
    border: none;
    background: transparent;
    padding: 6px 18px;
    border-radius: 999px;
    font-size: 13px;
    color: #d1d5db;
    cursor: pointer;
    transition: all .15s;
    font-family: inherit;
  }
  .mode-btn.active { background: #3b82f6; color: #fff; font-weight: 600; }
  .mode-btn:disabled { cursor: not-allowed; opacity: .6; }
  .mode-hint { font-size: 12px; color: #9ca3af; }
  /* ---------- 消息区 ---------- */
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 18px 14px;
    background: transparent;
  }
  .messages::-webkit-scrollbar { width: 6px; }
  .messages::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 3px; }
  .time-divider {
    text-align: center;
    font-size: 12px;
    color: #9ca3af;
    margin: 10px 0 16px;
  }
  /* 讨论阶段分隔条 */
  .phase-divider {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 6px 0 16px;
    animation: fadeIn .3s ease;
  }
  .phase-divider::before, .phase-divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: rgba(75, 85, 99, 0.5);
  }
  .phase-divider span {
    font-size: 12px;
    color: #d1d5db;
    background: rgba(55, 65, 81, 0.75);
    padding: 3px 14px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .msg-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 18px;
    animation: fadeIn .25s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .msg-row.user { flex-direction: row-reverse; }
  .avatar {
    width: 42px; height: 42px;
    border-radius: 8px;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 15px; color: #fff;
    box-shadow: 0 2px 6px rgba(0,0,0,.15);
  }
  .avatar.doubao    { background: linear-gradient(135deg, #ff6a3d, #f43f5e); }
  .avatar.qwen      { background: linear-gradient(135deg, #8b5cf6, #6d28d9); }
  .avatar.deepseek  { background: linear-gradient(135deg, #3b82f6, #1d4ed8); }
  .avatar.user      { background: linear-gradient(135deg, #10b981, #059669); }
  .mini-avatar.doubao   { background: #f43f5e; }
  .mini-avatar.qwen     { background: #7c3aed; }
  .mini-avatar.deepseek { background: #2563eb; }
  .msg-body { max-width: 72%; min-width: 0; }
  .msg-row.user .msg-body { display: flex; flex-direction: column; align-items: flex-end; }
  .sender-name { font-size: 12px; color: #9ca3af; margin: 0 2px 4px; display: flex; align-items: center; gap: 6px; }
  .role-tag {
    font-size: 10px;
    padding: 1px 8px;
    border-radius: 999px;
    background: #dbeafe;
    color: #1d4ed8;
  }
  .role-tag.summary { background: #fef3c7; color: #b45309; }
  .bubble {
    padding: 10px 14px;
    border-radius: 8px;
    background: #fff;
    font-size: 15px;
    line-height: 1.65;
    color: #1f2937;
    box-shadow: 0 1px 2px rgba(0,0,0,.06);
    word-break: break-word;
    white-space: pre-wrap;
    position: relative;
  }
  .msg-row.ai .bubble::before {
    content: "";
    position: absolute;
    left: -6px; top: 13px;
    border: 6px solid transparent;
    border-right-color: #fff;
    border-left: none;
  }
  .msg-row.user .bubble { background: #95ec69; }
  .msg-row.user .bubble::after {
    content: "";
    position: absolute;
    right: -6px; top: 13px;
    border: 6px solid transparent;
    border-left-color: #95ec69;
    border-right: none;
  }
  /* 总结气泡：金色高亮 */
  .msg-row.summary .bubble {
    background: #fffbe6;
    border: 1px solid #f0d060;
    box-shadow: 0 2px 10px rgba(240, 180, 30, .25);
  }
  .msg-row.summary .bubble::before { border-right-color: #fffbe6; }
  /* ---------- 打字动画 ---------- */
  .typing { display: inline-flex; gap: 4px; align-items: center; padding: 4px 2px; }
  .typing span {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #9ca3af;
    animation: bounce 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: .15s; }
  .typing span:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: .5; }
    30% { transform: translateY(-5px); opacity: 1; }
  }
  /* ---------- 输入区 ---------- */
  .input-area {
    display: flex;
    gap: 10px;
    padding: 12px 14px;
    background: rgba(31, 41, 55, 0.85);
    border-top: 1px solid rgba(75, 85, 99, 0.4);
    flex-shrink: 0;
  }
  .input-area textarea {
    flex: 1;
    resize: none;
    border: 1px solid #4b5563;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 15px;
    font-family: inherit;
    line-height: 1.5;
    max-height: 120px;
    outline: none;
    background: rgba(17, 24, 39, 0.85);
    color: #f3f4f6;
  }
  .input-area textarea::placeholder { color: #6b7280; }
  .input-area textarea:focus { border-color: #3b82f6; }
  .send-btn {
    border: none;
    border-radius: 8px;
    padding: 0 22px;
    background: #10b981;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s;
  }
  .send-btn:hover:not(:disabled) { background: #059669; }
  .send-btn:disabled { background: #a7d7c5; cursor: not-allowed; }
  @media (max-width: 640px) {
    .chat-container { max-height: 100vh; box-shadow: none; }
    .msg-body { max-width: 80%; }
    .mode-hint { display: none; }
  }
</style>
</head>
<body>
<div class="chat-container">
  <div class="header">
    <div class="avatars">
      <div class="mini-avatar doubao">豆</div>
      <div class="mini-avatar qwen">千</div>
      <div class="mini-avatar deepseek">DS</div>
    </div>
    <div class="title-box">
      <div class="title">AI 交流群（4）</div>
      <div class="subtitle">豆包、通义千问、DeepSeek 在线</div>
    </div>
    <div class="mode-badge" id="modeBadge">连接中…</div>
  </div>

  <div class="mode-bar">
    <div class="mode-switch">
      <button class="mode-btn active" data-mode="chat">依次回答</button>
      <button class="mode-btn" data-mode="discuss">讨论模式</button>
    </div>
    <span class="mode-hint" id="modeHint">三位 AI 将依次回复你的问题</span>
  </div>

  <div class="messages" id="messages">
    <div class="time-divider" id="startTime"></div>
  </div>

  <div class="input-area">
    <textarea id="input" rows="1" placeholder="向三位 AI 提问…"></textarea>
    <button class="send-btn" id="sendBtn">发送</button>
  </div>
</div>

<script>
const MODELS = [
  { key: "doubao",   name: "豆包",     avatarText: "豆" },
  { key: "qwen",     name: "通义千问", avatarText: "千" },
  { key: "deepseek", name: "DeepSeek", avatarText: "DS" },
];
const HOST = MODELS.find(m => m.key === "deepseek"); // 讨论模式的主持人，负责总结

const messagesEl = document.getElementById("messages");
const inputEl    = document.getElementById("input");
const sendBtn    = document.getElementById("sendBtn");
const modeBadge  = document.getElementById("modeBadge");
const modeHint   = document.getElementById("modeHint");
const modeBtns   = document.querySelectorAll(".mode-btn");

let history = [];        // 依次回答模式的对话历史
let currentMode = "chat";
let busy = false;

document.getElementById("startTime").textContent =
  new Date().toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" });

// 查询后端模式：真实 API 还是演示模式
fetch("/api/health").then(r => r.json()).then(data => {
  const liveCount = data.models.filter(m => m.live).length;
  if (liveCount === data.models.length) {
    modeBadge.textContent = "真实 API";
    modeBadge.classList.add("live");
  } else if (liveCount > 0) {
    modeBadge.textContent = `部分真实（${liveCount}/${data.models.length}）`;
  } else {
    modeBadge.textContent = "演示模式";
  }
}).catch(() => { modeBadge.textContent = "离线"; });

// 模式切换
modeBtns.forEach(btn => btn.addEventListener("click", () => {
  if (busy || btn.dataset.mode === currentMode) return;
  currentMode = btn.dataset.mode;
  modeBtns.forEach(b => b.classList.toggle("active", b === btn));
  modeHint.textContent = currentMode === "chat"
    ? "三位 AI 将依次回复你的问题"
    : "三位 AI 先讨论，最后由 DeepSeek 总结结论";
  inputEl.placeholder = currentMode === "chat"
    ? "向三位 AI 提问…"
    : "提出话题，三位 AI 将展开讨论并总结…";
}));

function scrollToBottom() {
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function addUserMessage(text) {
  const row = document.createElement("div");
  row.className = "msg-row user";
  row.innerHTML = `
    <div class="avatar user">我</div>
    <div class="msg-body"><div class="bubble"></div></div>`;
  row.querySelector(".bubble").textContent = text;
  messagesEl.appendChild(row);
  scrollToBottom();
}

function addDivider(text) {
  const div = document.createElement("div");
  div.className = "phase-divider";
  div.innerHTML = `<span></span>`;
  div.querySelector("span").textContent = text;
  messagesEl.appendChild(div);
  scrollToBottom();
}

// 创建一条 AI 消息外壳；opts.tag 为名字旁的小标签；opts.summary 为总结样式
function addAiShell(model, opts = {}) {
  const row = document.createElement("div");
  row.className = "msg-row ai" + (opts.summary ? " summary" : "");
  const tagHtml = opts.tag ? `<span class="role-tag ${opts.summary ? "summary" : ""}">${opts.tag}</span>` : "";
  row.innerHTML = `
    <div class="avatar ${model.key}">${model.avatarText}</div>
    <div class="msg-body">
      <div class="sender-name">${model.name}${tagHtml}</div>
      <div class="bubble"></div>
    </div>`;
  messagesEl.appendChild(row);
  scrollToBottom();
  return row;
}

function showTyping(row) {
  row.querySelector(".bubble").innerHTML =
    `<div class="typing"><span></span><span></span><span></span></div>`;
  scrollToBottom();
}

const sleep = ms => new Promise(r => setTimeout(r, ms));

// 请求某个模型发言，返回回复文本；opts: {phase, question, transcript, tag, summary}
async function askModel(model, opts = {}) {
  const row = addAiShell(model, opts);
  showTyping(row);
  const payload = {
    model: model.key,
    phase: opts.phase || "chat",
    history,
    question: opts.question || "",
    transcript: opts.transcript || [],
  };
  // 至少展示一会儿打字动画，避免一闪而过
  const [resp] = await Promise.all([
    fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    }).then(r => r.json()).catch(() => ({ content: "（网络错误，请稍后再试）" })),
    sleep(600 + Math.random() * 800),
  ]);
  const content = resp.content || "（无回复）";
  row.querySelector(".bubble").textContent = content;
  scrollToBottom();
  return content;
}

// 模式一：依次回答
async function runChat(question) {
  history.push({ role: "user", content: question });
  for (const model of MODELS) {
    const content = await askModel(model);
    history.push({ role: "assistant", content: `[${model.name}] ${content}` });
    await sleep(400);
  }
}

// 模式二：讨论模式（观点 -> 交叉讨论 -> 总结，全程可见）
async function runDiscussion(question) {
  const transcript = [];

  addDivider("第一轮 · 各自发表观点");
  for (const model of MODELS) {
    const content = await askModel(model, { phase: "opinion", question, transcript, tag: "观点" });
    transcript.push({ name: model.name, content });
    await sleep(400);
  }

  addDivider("第二轮 · 交叉讨论");
  for (const model of MODELS) {
    const content = await askModel(model, { phase: "discuss", question, transcript, tag: "讨论" });
    transcript.push({ name: model.name, content });
    await sleep(400);
  }

  addDivider("主持人总结");
  const summary = await askModel(HOST, { phase: "summary", question, transcript, tag: "总结", summary: true });

  // 把讨论结果并入对话历史，方便后续追问
  history.push({ role: "user", content: question });
  history.push({ role: "assistant", content: `[讨论总结] ${summary}` });
}

async function send() {
  const text = inputEl.value.trim();
  if (!text || busy) return;
  busy = true;
  sendBtn.disabled = true;
  modeBtns.forEach(b => b.disabled = true);
  inputEl.value = "";
  inputEl.style.height = "auto";

  addUserMessage(text);
  if (currentMode === "chat") {
    await runChat(text);
  } else {
    await runDiscussion(text);
  }

  busy = false;
  sendBtn.disabled = false;
  modeBtns.forEach(b => b.disabled = false);
  inputEl.focus();
}

sendBtn.addEventListener("click", send);
inputEl.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
inputEl.addEventListener("input", () => {
  inputEl.style.height = "auto";
  inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + "px";
});

// 开场白
(async () => {
  await sleep(400);
  const row = addAiShell(MODELS[0]);
  row.querySelector(".bubble").textContent =
    "大家好，我是豆包～可以切换到「讨论模式」，我和千问、DeepSeek 会先讨论再给你总结结论！";
  scrollToBottom();
  inputEl.focus();
})();
</script>
</body>
</html>
